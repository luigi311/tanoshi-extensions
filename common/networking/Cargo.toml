[package]
name = "networking"
version = "0.0.0"
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
cookie = "0.18"
# ureq's jar does not install a suffix list; validate imported solver domains
# against this bundled list before insertion (no runtime download).
psl = "2"
# humantime gives log lines timestamps so they can be correlated with
# FlareSolverr's own log output.
env_logger = { version = "0.11", default-features = false, features = [
    "humantime",
] }
log = { workspace = true }
scraper = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ureq = { version = "3", features = ["json", "cookies"] }
url = "2"
urlencoding = { workspace = true }

[dev-dependencies]
cookie_store = { version = "0.22", default-features = false, features = ["serde_json"] }
