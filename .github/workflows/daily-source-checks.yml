name: Daily source checks

on:
  schedule:
    # Daily at 13:17 UTC (06:17 MST / 07:17 MDT), away from the top of the hour.
    - cron: '17 13 * * *'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@02be93da58aa71fb456aa9c43b301149248829d8

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0

      # Live-site failures must fail the workflow so scheduled runs notify us.
      - name: Cargo test
        run: |
          docker run -d \
            --name=flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            --restart unless-stopped \
            --network=host \
            ghcr.io/flaresolverr/flaresolverr:latest

          # Sleep 5 seconds to wait for FlareSolverr to start
          sleep 5

          FLARESOLVERR_URL="http://localhost:8191/v1" cargo test -- --test-threads=1
          FLARESOLVERR_URL="http://localhost:8191/v1" cargo test -- --test-threads=1 --ignored

          # Stop FlareSolverr
          docker stop flaresolverr
