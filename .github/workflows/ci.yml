name: CI

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - .gitignore
      - "**/*.md"

env:
  RUST_TOOLCHAIN: 1.93.1
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@02be93da58aa71fb456aa9c43b301149248829d8

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0

      # Live-site failures must fail the workflow.
      - name: Cargo test
        run: |
          docker run -d \
            --name=flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            --restart unless-stopped \
            --network=host \
            ghcr.io/flaresolverr/flaresolverr:latest

          # Sleep 5 seconds to wait for FlareSolverr to start
          sleep 5

          FLARESOLVERR_URL="http://localhost:8191/v1" cargo test -- --test-threads=1
          FLARESOLVERR_URL="http://localhost:8191/v1" cargo test -- --test-threads=1 --ignored

          # Stop FlareSolverr
          docker stop flaresolverr

  build:
    strategy:
      matrix:
        platform:
          - os: ubuntu-24.04
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            extension: so
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            extension: so
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
            extension: dll
    runs-on: ${{ matrix.platform.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@02be93da58aa71fb456aa9c43b301149248829d8

      - uses: Swatinem/rust-cache@98c8021b550208e191a6a3145459bfc9fb29c4c0
        with:
          key: "${{ matrix.platform.target }}-cargo-cache-${{ hashFiles('**/Cargo.lock') }}"
      
      - name: Cargo Build
        run: cargo build --release

      - name: Generate json
        if: ${{ matrix.platform.target == 'x86_64-unknown-linux-gnu' }}
        run: |
          URL=$(curl -sL "https://api.github.com/repos/luigi311/tanoshi/releases/latest" | grep "tanoshi-cli" | grep '"browser_download_url":' | sed -E 's/.*"([^"]+)".*/\1/')
          curl -L $URL -o $HOME/.cargo/bin/tanoshi-cli
          chmod +x $HOME/.cargo/bin/tanoshi-cli
          $HOME/.cargo/bin/tanoshi-cli --path target/release generate-json
          mv output/${{ matrix.platform.target }}/index.json output/

      # Generate already puts things in output folder
      - if: ${{ matrix.platform.target != 'x86_64-unknown-linux-gnu' }}
        run: |
          mkdir -p output/${{ matrix.platform.target }}/
          cp target/release/*.${{ matrix.platform.extension }} output/${{ matrix.platform.target }}/

      # Windows already has the correct names
      - if: ${{ matrix.platform.target != 'x86_64-unknown-linux-gnu' && matrix.platform.target != 'x86_64-pc-windows-msvc' }}
        run: cd output/${{ matrix.platform.target }}/ && for f in *.${{ matrix.platform.extension }};do mv $f ${f#lib}; done; cd ../..

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.target }}
          path: output

  push:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - uses: actions/checkout@v4

      - name: Clone repo
        run: |
          git clone https://github.com/luigi311/tanoshi-extensions repository
          cd repository
          # Create branch if not exists
          git checkout ${{ env.RUST_TOOLCHAIN }} || git checkout -b ${{ env.RUST_TOOLCHAIN }}
          # Remove all existing files
          rm -rf *
          cd ..

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          path: repository
          merge-multiple: true

      - name: Commit files
        run: |
          cd repository
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          git commit -m "deploy"
          cd ..

      - name: Git Commit and Push
        uses: ad-m/github-push-action@v0.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.RUST_TOOLCHAIN }}
          directory: repository
